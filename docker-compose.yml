# Robô de Ofertas: painel + conexão com o WhatsApp (tudo num serviço só)
# Tudo sobe com: docker compose up -d

services:
  robo:
    build: ./app
    restart: always
    ports:
      - "80:3000"             # painel: http://IP-DO-SERVIDOR (no PC: http://localhost)
    env_file: .env
    volumes:
      - robo_data:/data       # banco, sessões do WhatsApp e imagens

volumes:
  robo_data:
